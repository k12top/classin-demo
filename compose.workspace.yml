name: classin-unified
services:
  postgres:
    image: postgres:17.10-alpine3.23
    container_name: classin-unified-postgres
    ports:
      - '127.0.0.1:35432:5432'
    environment:
      POSTGRES_DB: classin_unified_dev
      POSTGRES_USER: classin_dev
      POSTGRES_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Run npm run workspace:db first}
    volumes:
      - workspace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  workspace-postgres:
